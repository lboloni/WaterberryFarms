input-to-notebook:
  - notebooks/Environment-Precalc.ipynb
planting: "standard"          # standard | tomato-only | strawberry-only
cache: null                   # true | false | null = cached, except for the full Waterberry farm
seed: 10                      # the seed of the epidemics
# TYLCV: an epidemic on the tomato cells
tylcv-p-transmission: 0.25
tylcv-infection-duration: 5
tylcv-infection-seeds: null   # null = 3 * max(width / 30, 1)
tylcv-spread-dimension: null  # null = min(11, 2 * int(sqrt(width) / 6) + 3)
tylcv-picture: null           # a png next to the exp/run, or null
tylcv-picture-mode: "static"  # static: the picture is the field on every day; initial: the epidemic starts from it
# CCR: an epidemic on the strawberry cells
ccr-p-transmission: 0.15
ccr-infection-duration: 10
ccr-infection-seeds: null
ccr-spread-dimension: null
ccr-picture: null
ccr-picture-mode: "static"
# soil moisture
soil-seed: 1
soil-evaporation: 0.04
soil-rainfall: 0.06
soil-rain-likelihood: 0.8
soil-picture: null            # static only: the picture is the soil moisture on every day
