# The unclustered mrse comparison on the 200x200 field (Miniberry-200), with the same robots and budget as on 100x100
# Experiment for the MRMR paper, three lawnmower robots arranged
# in a certain way

# FIXME: for the time being this is just a placeholder with the
# 3 random ones, such that I can test the flow

# stuff to pick
# exp_environment: "miniberry-100-custom-mrmr"
name: "3 lawnmowers"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "unclustered"
approach: "mrse"
map-size: 200

exp_environment: "environment"
run_environment: "mrmr-generated-unclustered-200"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"


timesteps-per-day: 1000
time-start-environment: 25

robots:
  - name: "lawn-1"
    exp-policy: "policy"
    run-policy: "fixed-budget-lawnmower"
    exp-policy-extra-parameters:
      area: [10, 10, 190, 60] # [xmin, ymin, xmax, ymax]
      policy-name: "lawn-bottom"
      budget: 1000 # same as timesteps-per-day
  - name: "lawn-2"
    exp-policy: "policy"
    run-policy: "fixed-budget-lawnmower"
    exp-policy-extra-parameters:
      area: [10, 70, 190, 120]
      policy-name: "lawn-middle"
      budget: 1000 # same as timesteps-per-day
  - name: "lawn-3"
    exp-policy: "policy"
    run-policy: "fixed-budget-lawnmower"
    exp-policy-extra-parameters:
      area: [10, 130, 190, 190]
      policy-name: "lawn-top"
      budget: 1000 # same as timesteps-per-day
