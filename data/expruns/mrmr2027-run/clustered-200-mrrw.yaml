# The clustered mrrw comparison on the 200x200 field (Miniberry-200), with the same robots and budget as on 100x100
# Experiment for the MRMR paper, three random waypoint robots
# FIXME: we will need to change the environment to a custom one with more 
# stuff to pick
# exp_environment: "miniberry-100-custom-mrmr"
name: "3 random waypoint"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "clustered"
approach: "mrrw"
map-size: 200

exp_environment: "environment"
run_environment: "mrmr-generated-clustered-200"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 1000
time-start-environment: 25

robots:
  - name: "robot-1"
    exp-policy: "policy"
    run-policy: "random-waypoint"
    exp-policy-extra-parameters:
      seed: 1
      name: rwp-1
      budget: 1000 # same as timesteps-per-day
  - name: "robot-2"
    exp-policy: "policy"
    run-policy: "random-waypoint-seed10"
    exp-policy-extra-parameters:
      seed: 10
      name: rwp-2
      budget: 1000 # same as timesteps-per-day
  - name: "robot-3"
    exp-policy: "policy"
    run-policy: "random-waypoint-seed20"
    exp-policy-extra-parameters:
      seed: 20
      name: rwp-3
      budget: 1000 # same as timesteps-per-day
