# The clustered ucba comparison on the 100x100 field with a team of 6: adapted UCB auction (A-UCBA, after Jia et al.)
name: "6 robots, adapted UCB auction (A-UCBA, after Jia et al.)"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "clustered"
approach: "ucba"
map-size: 100
team-size: 6 # the number of robots

exp_environment: "environment"
run_environment: "marex-generated-clustered-100"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 500 # the budget of the 100x100 field
time-start-environment: 25

robots:
  - name: "auc-1"
    exp-policy: "policy"
    run-policy: "ucb-auction"
    exp-policy-extra-parameters:
      policy-name: "ucb-auction-1"
      seed: 1
      auctioneer: true
      interest-points: 10
      budget: 500 # same as timesteps-per-day
  - name: "auc-2"
    exp-policy: "policy"
    run-policy: "ucb-auction"
    exp-policy-extra-parameters:
      policy-name: "ucb-auction-2"
      seed: 2
      interest-points: 10
      budget: 500 # same as timesteps-per-day
  - name: "auc-3"
    exp-policy: "policy"
    run-policy: "ucb-auction"
    exp-policy-extra-parameters:
      policy-name: "ucb-auction-3"
      seed: 3
      interest-points: 10
      budget: 500 # same as timesteps-per-day
  - name: "auc-4"
    exp-policy: "policy"
    run-policy: "ucb-auction"
    exp-policy-extra-parameters:
      policy-name: "ucb-auction-4"
      seed: 4
      interest-points: 10
      budget: 500 # same as timesteps-per-day
  - name: "auc-5"
    exp-policy: "policy"
    run-policy: "ucb-auction"
    exp-policy-extra-parameters:
      policy-name: "ucb-auction-5"
      seed: 5
      interest-points: 10
      budget: 500 # same as timesteps-per-day
  - name: "auc-6"
    exp-policy: "policy"
    run-policy: "ucb-auction"
    exp-policy-extra-parameters:
      policy-name: "ucb-auction-6"
      seed: 6
      interest-points: 10
      budget: 500 # same as timesteps-per-day
