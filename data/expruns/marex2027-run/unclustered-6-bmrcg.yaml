# The unclustered bmrcg comparison on the 100x100 field with a team of 6: balanced confidence-guided (BMRCG)
name: "6 robots, balanced confidence-guided (BMRCG)"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "unclustered"
approach: "bmrcg"
map-size: 100
team-size: 6 # the number of robots

exp_environment: "environment"
run_environment: "marex-generated-unclustered-100"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 500 # the budget of the 100x100 field
time-start-environment: 25

# the team divides the area into one strip per robot, nearest first, such that every robot covers its strip
# with the same lawnmower density after its travel from the home base
balanced-areas:
  area: [5, 5, 95, 95] # [xmin, ymin, xmax, ymax]

robots:
  - name: "cg-1"
    exp-policy: "policy"
    run-policy: "balanced-confidence-guided"
    exp-policy-extra-parameters:
      policy-name: "balanced-confidence-guided-1"
      seed: 1
      budget: 500 # same as timesteps-per-day
  - name: "cg-2"
    exp-policy: "policy"
    run-policy: "balanced-confidence-guided"
    exp-policy-extra-parameters:
      policy-name: "balanced-confidence-guided-2"
      seed: 2
      budget: 500 # same as timesteps-per-day
  - name: "cg-3"
    exp-policy: "policy"
    run-policy: "balanced-confidence-guided"
    exp-policy-extra-parameters:
      policy-name: "balanced-confidence-guided-3"
      seed: 3
      budget: 500 # same as timesteps-per-day
  - name: "cg-4"
    exp-policy: "policy"
    run-policy: "balanced-confidence-guided"
    exp-policy-extra-parameters:
      policy-name: "balanced-confidence-guided-4"
      seed: 4
      budget: 500 # same as timesteps-per-day
  - name: "cg-5"
    exp-policy: "policy"
    run-policy: "balanced-confidence-guided"
    exp-policy-extra-parameters:
      policy-name: "balanced-confidence-guided-5"
      seed: 5
      budget: 500 # same as timesteps-per-day
  - name: "cg-6"
    exp-policy: "policy"
    run-policy: "balanced-confidence-guided"
    exp-policy-extra-parameters:
      policy-name: "balanced-confidence-guided-6"
      seed: 6
      budget: 500 # same as timesteps-per-day
