# The clustered aguts-sp comparison on the 100x100 field with a team of 3: 3 robots of adapted GUTS with a spatial posterior (decentralized Thompson sampling)
# (papers/y2027_marex/thompson_sampling.py, after GUTS; paper-MRMR PLAN-ComparisonStudy.md, Plan A)
name: "3 adapted GUTS, spatial posterior"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "clustered"
approach: "aguts-sp"
map-size: 100
team-size: 3 # the number of robots

exp_environment: "environment"
run_environment: "marex-generated-clustered-100"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 500 # the budget of the 100x100 field
time-start-environment: 25

robots:
  - name: "ts-1"
    exp-policy: "policy"
    run-policy: "thompson-sampling"
    exp-policy-extra-parameters:
      policy-name: "thompson-sampling-1"
      seed: 1
      budget: 500 # same as timesteps-per-day
  - name: "ts-2"
    exp-policy: "policy"
    run-policy: "thompson-sampling"
    exp-policy-extra-parameters:
      policy-name: "thompson-sampling-2"
      seed: 2
      budget: 500 # same as timesteps-per-day
  - name: "ts-3"
    exp-policy: "policy"
    run-policy: "thompson-sampling"
    exp-policy-extra-parameters:
      policy-name: "thompson-sampling-3"
      seed: 3
      budget: 500 # same as timesteps-per-day
