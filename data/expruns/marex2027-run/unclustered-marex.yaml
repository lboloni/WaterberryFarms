# Experiment for the MAREX paper: a lead robot placing experiments and two robots doing bidding and detection

# FIXME: for the time being this is just a placeholder with the
# 3 random ones, such that I can test the flow

# stuff to pick
name: "1 pioneer 2 contractors"

#exp_environment: "miniberry-100"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "unclustered"
approach: "marex"
map-size: 100
team-size: 3 # the number of robots
# the contractors also create EPs from the streaks they find outside their EPs (DESIGN-Market.md)
marex-contractors-offer: true
# the parameters of MAREX, with the defaults of MAREX_DEFAULTS (DESIGN-Market.md)
marex-ep-step: 1 # the resolution of the EPs: the distance between the passes of their lawnmower (1: every row)
marex-ep-border: 3 # the border by which the bounding box of a streak is extended into an EP
marex-prize-factor: 0.1 # the prize of an EP per unit of its area
marex-streak-below: 1.0 # a streak is made of the observations below this TYLCV value (1.0: the infected and the destroyed plants)
marex-award-delay-rounds: 2 # the communication rounds between the broadcast of an offer and its award
marex-bid-evaluations: 2000 # the bound of the EP path search when bidding (evaluated combinations)
marex-replan-evaluations: 20000 # the same, when replanning

exp_environment: "environment"
run_environment: "marex-generated-unclustered-100"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 500 # the budget of the 100x100 field
time-start-environment: 25

robots:
  - name: "pio"
    exp-policy: "policy"
    run-policy: "generic"
    exp-policy-extra-parameters:
      policy-name: "marex-pioneer"
      seed: 1
      budget: 500 # same as timesteps-per-day
      # area: "[5, 5, 95, 95]" # [xmin, ymin, xmax, ymax]
  - name: "con-1"
    exp-policy: "policy"
    run-policy: "generic"
    exp-policy-extra-parameters:
      policy-name: "marex-contractor-1"
      seed: 2
      budget: 500 # same as timesteps-per-day
  - name: "con-2"
    exp-policy: "policy"
    run-policy: "generic"
    exp-policy-extra-parameters:
      policy-name: "marex-contractor-2"
      seed: 3
      budget: 500 # same as timesteps-per-day
