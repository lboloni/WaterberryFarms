# The unclustered bmrse comparison on the 200x200 field with a team of 10: balanced lawnmowers (BMRSE)
name: "10 robots, balanced lawnmowers (BMRSE)"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "unclustered"
approach: "bmrse"
map-size: 200
team-size: 10 # the number of robots

exp_environment: "environment"
run_environment: "marex-generated-unclustered-200"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 1000
time-start-environment: 25

# the team divides the area into one strip per robot, nearest first, such that every robot covers its strip
# with the same lawnmower density after its travel from the home base
balanced-areas:
  area: [10, 10, 190, 190] # [xmin, ymin, xmax, ymax]

robots:
  - name: "lawn-1"
    exp-policy: "policy"
    run-policy: "balanced-lawnmower"
    exp-policy-extra-parameters:
      policy-name: "balanced-lawnmower-1"
      budget: 1000 # same as timesteps-per-day
  - name: "lawn-2"
    exp-policy: "policy"
    run-policy: "balanced-lawnmower"
    exp-policy-extra-parameters:
