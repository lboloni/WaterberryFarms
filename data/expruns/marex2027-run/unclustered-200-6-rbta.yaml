# The unclustered rbta comparison on the 200x200 field with a team of 6: RBTA, region-based task allocation (after Edmonds & Yi)
# (paper-MRMR PLAN-ComparisonStudy.md)
name: "6 robots, RBTA, region-based task allocation (after Edmonds & Yi)"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "unclustered"
approach: "rbta"
map-size: 200
team-size: 6 # the number of robots

exp_environment: "environment"
run_environment: "marex-generated-unclustered-200"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 1000
time-start-environment: 25

robots:
  - name: "rbta-1"
    exp-policy: "policy"
    run-policy: "region-task-allocation"
    exp-policy-extra-parameters:
      policy-name: "region-task-allocation-1"
      budget: 1000 # same as timesteps-per-day
  - name: "rbta-2"
    exp-policy: "policy"
    run-policy: "region-task-allocation"
    exp-policy-extra-parameters:
      policy-name: "region-task-allocation-2"
      budget: 1000 # same as timesteps-per-day
  - name: "rbta-3"
    exp-policy: "policy"
    run-policy: "region-task-allocation"
    exp-policy-extra-parameters:
      policy-name: "region-task-allocation-3"
      budget: 1000 # same as timesteps-per-day
  - name: "rbta-4"
    exp-policy: "policy"
    run-policy: "region-task-allocation"
    exp-policy-extra-parameters:
      policy-name: "region-task-allocation-4"
      budget: 1000 # same as timesteps-per-day
  - name: "rbta-5"
    exp-policy: "policy"
    run-policy: "region-task-allocation"
    exp-policy-extra-parameters:
      policy-name: "region-task-allocation-5"
      budget: 1000 # same as timesteps-per-day
  - name: "rbta-6"
    exp-policy: "policy"
    run-policy: "region-task-allocation"
    exp-policy-extra-parameters:
      policy-name: "region-task-allocation-6"
      budget: 1000 # same as timesteps-per-day
