# The clustered mrrw comparison on the 200x200 field (Miniberry-200) with a team of 6 robots, the same
# budget per robot as the teams of 3
name: "6 random waypoint"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "clustered"
approach: "mrrw"
map-size: 200
team-size: 6 # the number of robots

exp_environment: "environment"
run_environment: "marex-generated-clustered-200"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 1000
time-start-environment: 25

robots:
  - name: "robot-1"
    exp-policy: "policy"
    run-policy: "random-waypoint"
    exp-policy-extra-parameters:
      seed: 1
      name: rwp-1
      budget: 1000 # same as timesteps-per-day
  - name: "robot-2"
    exp-policy: "policy"
    run-policy: "random-waypoint"
    exp-policy-extra-parameters:
      seed: 11
      name: rwp-2
      budget: 1000 # same as timesteps-per-day
  - name: "robot-3"
    exp-policy: "policy"
    run-policy: "random-waypoint"
    exp-policy-extra-parameters:
      seed: 21
      name: rwp-3
      budget: 1000 # same as timesteps-per-day
  - name: "robot-4"
    exp-policy: "policy"
    run-policy: "random-waypoint"
    exp-policy-extra-parameters:
      seed: 31
      name: rwp-4
      budget: 1000 # same as timesteps-per-day
  - name: "robot-5"
    exp-policy: "policy"
    run-policy: "random-waypoint"
    exp-policy-extra-parameters:
      seed: 41
      name: rwp-5
      budget: 1000 # same as timesteps-per-day
  - name: "robot-6"
    exp-policy: "policy"
    run-policy: "random-waypoint"
    exp-policy-extra-parameters:
      seed: 51
      name: rwp-6
      budget: 1000 # same as timesteps-per-day
