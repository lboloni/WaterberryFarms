# The clustered aguts-sp comparison on the 200x200 field with a team of 10: adapted GUTS with a spatial posterior (A-GUTS-SP, the footprint of the policy defaults)
name: "10 robots, adapted GUTS with a spatial posterior (A-GUTS-SP)"

# the scenario and the approach, for the aggregation of replications (DESIGN-MultiSeedEvaluation.md)
scenario: "clustered"
approach: "aguts-sp"
map-size: 200
team-size: 10 # the number of robots

exp_environment: "environment"
run_environment: "marex-generated-clustered-200"

exp_estimator: "estimator"
run_estimator: "adaptive-disk"

exp_score: "score"
run_score: "voi"

timesteps-per-day: 1000
time-start-environment: 25

robots:
  - name: "ts-1"
    exp-policy: "policy"
    run-policy: "thompson-sampling"
    exp-policy-extra-parameters:
      policy-name: "thompson-sampling-1"
      seed: 1
      budget: 1000 # same as timesteps-per-day
  - name: "ts-2"
    exp-policy: "policy"
    run-policy: "thompson-sampling"
    exp-policy-extra-parameters:
      policy-name: "thompson-sampling-2"
