name: Absolute VoI of the approaches on the clustered maps, box plots, one panel per field size and team size, each field size on its own axis from 0
# standard box plots of the replications: the box spans the quartiles, with the median; the whiskers 1.5 IQR
figure-kind: boxes
metrics: [voi-absolute]
# one panel per field size (rows) and team size (columns); each row shares its vertical axis, which starts at 0
panels:
  - - {where: {map-size: 100, team-size: 3}, title: "100x100, 3 robots (MAREX 1+2)"}
    - {where: {map-size: 100, team-size: 6}, title: "100x100, 6 robots (MAREX 1+5)"}
    - {where: {map-size: 100, team-size: 10}, title: "100x100, 10 robots (MAREX 1+9)"}
  - - {where: {map-size: 200, team-size: 3}, title: "200x200, 3 robots (MAREX 1+2)"}
    - {where: {map-size: 200, team-size: 6}, title: "200x200, 6 robots (MAREX 1+5)"}
    - {where: {map-size: 200, team-size: 10}, title: "200x200, 10 robots (MAREX 1+9)"}
start-at-zero: true
scenarios: [clustered]
output-filename: replicated-boxes-voi-clustered.pdf
source-experiment: marex2027-aggregate
source-runs:
  - icc-2027-replicated
labels: {marex: MAREX, bmrse: BMRSE, bmrcg: BMRCG, aguts: A-GUTS, ucba: A-UCBA, rbta: RBTA, mrrw: MRRW, clustered: clustered, unclustered: unclustered, timestep: Timestep}
approaches: [mrrw, bmrse, bmrcg, rbta, aguts, ucba, marex]
input-to-notebook:
  - papers/y2027_marex/MAREX-Visualize-Replicated.ipynb
